<script>
    // 日時の表を1週間ずつ表示する。最初はページに入っている週だけで、ほかの週は必要になったときに読み込む
    const weekArea = document.getElementById('week-area');
    const weekStarts = JSON.parse(document.getElementById('week-starts').textContent);
    const weekEls = {};
    const weekLoading = {};
    let current = Number(weekArea.dataset.index);
    weekArea.querySelectorAll('.week').forEach((el) => { weekEls[el.dataset.start] = el; });

    function weekUrl(start) {
        const url = weekArea.dataset.url;
        return url + (url.includes('?') ? '&' : '?') + 'start=' + start;
    }

    function loadWeek(index) {
        const start = weekStarts[index];
        if (weekEls[start]) return Promise.resolve(weekEls[start]);
        if (!weekLoading[start]) {
            weekLoading[start] = fetch(weekUrl(start), { headers: { 'X-Requested-With': 'fetch' } })
                .then((response) => {
                    if (!response.ok) throw new Error();
                    return response.text();
                })
                .then((html) => {
                    const template = document.createElement('template');
                    template.innerHTML = html.trim();
                    const el = template.content.firstElementChild;
                    el.hidden = true;
                    weekArea.appendChild(el);
                    weekEls[start] = el;
                    return el;
                })
                .finally(() => { delete weekLoading[start]; });
        }
        return weekLoading[start];
    }

    async function showWeek(index) {
        if (index < 0 || index >= weekStarts.length) return;
        current = index;
        document.getElementById('prev').disabled = index === 0;
        document.getElementById('next').disabled = index === weekStarts.length - 1;
        const title = document.getElementById('week-title');
        if (!weekEls[weekStarts[index]]) title.textContent = '読み込み中…';
        try {
            const el = await loadWeek(index);
            if (current !== index) return;  // 読み込み中に別の週が押されたとき
            Object.values(weekEls).forEach((week) => { week.hidden = week !== el; });
            title.textContent = el.dataset.title;
        } catch (error) {
            title.textContent = '';
            alert('読み込めませんでした。画面を読み込みなおしてください。');
            return;
        }
        // 前後の週を先に読み込んでおき、押したときにすぐ表示できるようにする
        [index + 1, index - 1].forEach((i) => {
            if (i >= 0 && i < weekStarts.length) loadWeek(i).catch(() => {});
        });
    }

    // 画面に戻ってきたとき（タブの切り替え・「戻る」など）は、読み込んである週を最新の状態に読みなおす
    // （画面を開いたあとに枠が閉じられたり、予約が入ったりしていることがあるため）
    async function refreshWeeks() {
        const checked = document.querySelector('input[name="slot"]:checked');
        const checkedValue = checked ? checked.value : null;
        await Promise.all(Object.entries(weekEls).map(async ([start, old]) => {
            try {
                const response = await fetch(weekUrl(start), { headers: { 'X-Requested-With': 'fetch' } });
                if (!response.ok) return;
                const template = document.createElement('template');
                template.innerHTML = (await response.text()).trim();
                const el = template.content.firstElementChild;
                el.hidden = old.hidden;
                old.replaceWith(el);
                weekEls[start] = el;
            } catch (error) {
                // 読みなおせなかったときは、今の表示のままにする（申し込みのときにもう一度確かめる）
            }
        }));
        if (checkedValue) {
            const input = weekArea.querySelector(`input[name="slot"][value="${checkedValue}"]`);
            if (input) input.checked = true;
        }
        if (typeof onWeeksRefreshed === 'function') onWeeksRefreshed();
    }

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') refreshWeeks();
    });
    window.addEventListener('pageshow', (event) => {
        if (event.persisted) refreshWeeks();
    });
</script>
