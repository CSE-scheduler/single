# nginx の設定の雛形（gunicorn の前に置き、HTTPS と静的ファイルを受け持つ）。
#
#   1. schedule.example.ac.jp（ドメイン）と /srv/scheduler（プロジェクトのフォルダ）を書き換える
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/scheduler
#      sudo ln -s /etc/nginx/sites-available/scheduler /etc/nginx/sites-enabled/
#   3. HTTPS の証明書を取る（例：sudo certbot --nginx -d schedule.example.ac.jp）
#   4. sudo nginx -t && sudo systemctl reload nginx
#
#   local_settings.py の SECURE_PROXY_SSL_HEADER の行の # を外すのを忘れないこと。

server {
    listen 80;
    server_name schedule.example.ac.jp;
    # HTTP で来たら HTTPS に移す
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name schedule.example.ac.jp;

    # certbot を使うと、この2行は自動で書き込まれる
    ssl_certificate     /etc/letsencrypt/live/schedule.example.ac.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schedule.example.ac.jp/privkey.pem;

    # 説明書のアップロード（10MBまで）が通るように
    client_max_body_size 15m;

    # CSS・画像（python manage.py collectstatic で集めたもの）
    location /static/ {
        alias /srv/scheduler/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
